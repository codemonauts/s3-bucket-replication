name: Test

on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:

  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check format
        uses: psf/black@stable
        with:
          options: " -l 120 --check -t py314"
          src: "."

      - name: Lint
        run: |
          pip install pylint boto3
          pylint lambda_function.py
